version: '3.8'

services:
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iglesia360-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Puerto del servidor
      - PORT=3000
      
      # Configuración de correo (reemplaza con tus valores)
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_SECURE=${EMAIL_SECURE:-false}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_TO=${EMAIL_TO}
      
      # Configuración de la aplicación
      - NODE_ENV=${NODE_ENV:-production}
      - SESSION_NAME=${SESSION_NAME:-iglesia360-session}
      - API_URL=${API_URL:-http://localhost:3000}
    
    volumes:
      # Persistencia de sesión de WhatsApp
      - whatsapp-session:/app/.wwebjs_auth
      - whatsapp-cache:/app/.wwebjs_cache
      - bot-logs:/app/logs
    
    # Recursos del contenedor
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    
    # Variables de seguridad
    security_opt:
      - no-new-privileges:true
    
    # Healthcheck
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whatsapp-session:
    driver: local
  whatsapp-cache:
    driver: local
  bot-logs:
    driver: local

networks:
  default:
    name: iglesia360-network
